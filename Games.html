<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Slides</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #04110f 0%, #0d2b26 50%, #04110f 100%);
            color: white;
            display: flex;
            flex-direction: column;
        }

        .header {
            text-align: center;
            padding: 10px 16px;
            background: rgba(0, 229, 255, 0.08);
            border-bottom: 2px solid #00e5ff;
            flex-shrink: 0;
            position: relative;
        }

        .header h1 {
            font-size: 1.8em;
            color: #00e5ff;
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
            letter-spacing: 2px;
        }

        .slide-counter {
            color: #7fd9c9;
            font-size: 0.85em;
            margin-top: 2px;
        }

        .slide-stage {
            flex: 1;
            min-height: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            position: relative;
        }

        .slide-image {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
            border-radius: 14px;
            border: 3px solid #00e5ff;
            box-shadow: 0 0 50px rgba(0, 229, 255, 0.4);
        }

        .slide-placeholder {
            color: #5c8a82;
            font-size: 1.1em;
            text-align: center;
            line-height: 1.8;
        }

        .slide-title-card {
            font-size: 3em;
            font-weight: 800;
            text-align: center;
            color: #00e5ff;
            text-shadow: 0 0 30px rgba(0, 229, 255, 0.8), 0 0 60px rgba(255, 47, 208, 0.4);
            letter-spacing: 1px;
            padding: 20px;
        }

        .controls {
            display: flex;
            gap: 14px;
            justify-content: center;
            align-items: center;
            padding: 14px;
            flex-shrink: 0;
        }

        .slide-jump-bar {
            display: none;
            justify-content: center;
            padding: 0 14px 14px;
            flex-shrink: 0;
        }

        .slide-jump-bar.show { display: flex; }

        .controls-toggle {
            position: fixed;
            bottom: 14px;
            right: 14px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(0, 229, 255, 0.3);
            background: rgba(0, 0, 0, 0.35);
            color: rgba(127, 217, 201, 0.5);
            font-size: 1em;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }

        .controls-toggle:hover {
            color: #00e5ff;
            border-color: #00e5ff;
            background: rgba(0, 229, 255, 0.12);
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn:disabled { opacity: 0.4; cursor: not-allowed; }

        .btn-nav {
            background: linear-gradient(135deg, #ff2fd0, #7b2ff7);
            color: white;
            box-shadow: 0 4px 15px rgba(255, 47, 208, 0.4);
        }

        .btn-nav:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 47, 208, 0.6);
        }

        .back-link {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: #7fd9c9;
            font-size: 0.8em;
            text-decoration: none;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 20px;
            padding: 6px 14px;
            transition: all 0.3s;
        }

        .back-link:hover {
            color: #00e5ff;
            border-color: #00e5ff;
        }

        .slide-jump {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #7fd9c9;
            font-size: 0.8em;
        }

        .slide-jump select {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(0, 229, 255, 0.4);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.95em;
            max-width: 40vw;
        }

        .slide-jump select option {
            background: #0d2b26;
            color: white;
        }
    </style>
</head>
<body>

<div class="header">
    <h1>🎮 GAME TIME 🎮</h1>
    <div class="slide-counter" id="slideCounter">Loading slides...</div>
    <a class="back-link" href="LuckyDraw.html">🎁 Lucky Draw</a>
</div>

<div class="slide-stage" id="slideStage">
    <div class="slide-placeholder" id="slidePlaceholder">Loading...</div>
</div>

<div class="controls" id="controls">
    <button class="btn btn-nav" id="btnPrev" onclick="prevSlide()">◀ Previous</button>
    <button class="btn btn-nav" id="btnNext" onclick="nextSlide()">Next ▶</button>
</div>

<div class="slide-jump-bar" id="slideJumpBar">
    <div class="slide-jump">
        <label for="slideJumpSelect">📍 Jump to:</label>
        <select id="slideJumpSelect" onchange="showSlide(parseInt(this.value, 10))"></select>
    </div>
</div>

<button class="controls-toggle" id="controlsToggle" onclick="toggleControls()" title="Show/hide jump-to list">🎛</button>

<script>
let slides = [];
let currentIndex = 0;
const correctAnswerSound = new Audio('soundeffects/Lucky draw game (when show correct answer).mp3');

async function init() {
    try {
        const response = await fetch('game_slides.txt', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        slides = (await response.text())
            .split(/\r?\n/)
            .map(name => name.trim())
            .filter(Boolean);
    } catch (error) {
        console.error('Unable to load game_slides.txt:', error);
        document.getElementById('slideCounter').textContent =
            'Unable to load game_slides.txt. Open this page through a local web server.';
        return;
    }

    if (!slides.length) {
        document.getElementById('slideCounter').textContent = 'No slides listed in game_slides.txt';
        return;
    }

    const savedIndex = parseInt(localStorage.getItem('gameSlideIndex'), 10);
    const startIndex = Number.isInteger(savedIndex) && savedIndex >= 0 && savedIndex < slides.length
        ? savedIndex
        : 0;
    populateSlideJumpOptions();
    showSlide(startIndex);
}

function populateSlideJumpOptions() {
    const select = document.getElementById('slideJumpSelect');
    select.innerHTML = slides.map((slide, i) =>
        `<option value="${i}">${i + 1}. ${slideLabel(slide)}</option>`
    ).join('');
}

function isTitleSlide(slide) {
    return /^title:/i.test(slide);
}

function slideLabel(slide) {
    return isTitleSlide(slide) ? slide.replace(/^title:/i, '').trim() : slide;
}

// Round slides are named e.g. Game1_Round1_0.jpg (question) and
// Game1_Round1_1.jpg (answer) — play the sound when an answer slide shows.
function isAnswerSlide(slide) {
    return /_1\.[a-z0-9]+$/i.test(slide);
}

function showSlide(index) {
    currentIndex = index;
    const slide = slides[currentIndex];
    const stage = document.getElementById('slideStage');

    stage.innerHTML = isTitleSlide(slide)
        ? `<div class="slide-title-card">${slideLabel(slide)}</div>`
        : `<img class="slide-image" src="game_images/${slide}" alt="Game slide">`;

    document.getElementById('slideCounter').textContent =
        `Slide ${currentIndex + 1} of ${slides.length} — ${slideLabel(slide)}`;
    document.getElementById('btnPrev').disabled = currentIndex === 0;
    document.getElementById('btnNext').disabled = currentIndex === slides.length - 1;
    document.getElementById('slideJumpSelect').value = String(currentIndex);
    localStorage.setItem('gameSlideIndex', String(currentIndex));

    if (isAnswerSlide(slide)) {
        correctAnswerSound.currentTime = 0;
        correctAnswerSound.play().catch(() => {});
    }
}

function nextSlide() {
    if (currentIndex < slides.length - 1) showSlide(currentIndex + 1);
}

function prevSlide() {
    if (currentIndex > 0) showSlide(currentIndex - 1);
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight') nextSlide();
    if (e.key === 'ArrowLeft') prevSlide();
});

function toggleControls() {
    document.getElementById('slideJumpBar').classList.toggle('show');
}

init();
</script>
</body>
</html>
