<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lucky Draw System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e 0%, #1a1a4e 50%, #0a0a2e 100%);
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .header {
            text-align: center;
            padding: 20px;
            background: rgba(255, 215, 0, 0.1);
            border-bottom: 2px solid gold;
            position: relative;
        }

        .header h1 {
            font-size: 2.5em;
            color: gold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            letter-spacing: 3px;
        }

        .header p {
            color: #aaa;
            margin-top: 5px;
        }

        .game-link {
            position: absolute;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 0.8em;
            text-decoration: none;
            border: 1px solid rgba(255,215,0,0.4);
            border-radius: 20px;
            padding: 6px 14px;
            transition: all 0.3s;
        }

        .game-link:hover {
            color: gold;
            border-color: gold;
        }

        .main-container {
            display: flex;
            gap: 15px;
            padding: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        /* ===== CENTER PANEL ===== */

        .panel-btn {
            width: 100%;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.8em;
            margin-top: 6px;
            transition: all 0.3s;
            border: 1px solid;
            flex-shrink: 0;
        }

        .export-btn {
            background: rgba(0, 200, 81, 0.15);
            border-color: rgba(0, 200, 81, 0.4);
            color: #88ff88;
        }

        .export-btn:hover { background: rgba(0, 200, 81, 0.35); }

        .clear-winners-btn {
            background: rgba(255, 50, 50, 0.15);
            border-color: rgba(255, 50, 50, 0.4);
            color: #ff8888;
        }

        .clear-winners-btn:hover { background: rgba(255, 50, 50, 0.35); }

        /* ===== CENTER PANEL ===== */
        .center-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        /* Stats */
        .stats-bar {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 10px;
            padding: 10px 20px;
            text-align: center;
            flex: 1;
            min-width: 80px;
        }

        .stat-item .stat-number {
            font-size: 1.8em;
            font-weight: bold;
            color: gold;
        }

        .stat-item .stat-label {
            font-size: 0.72em;
            color: #aaa;
        }

        /* Prize Setup */
        .prize-section {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 18px;
        }

        .prize-section.catalog-mode {
            padding: 12px 18px;
        }

        .prize-catalog-status {
            color: #ccc;
            text-align: center;
            font-size: 0.85em;
        }

        .prize-catalog-status strong { color: gold; }

        .prize-section h3 {
            color: gold;
            margin-bottom: 14px;
            font-size: 1em;
            text-align: center;
        }

        .prize-upload-area {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .prize-image-display {
            width: 130px;
            height: 130px;
            border: 2px dashed rgba(255, 215, 0, 0.5);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(0,0,0,0.3);
            flex-shrink: 0;
            transition: all 0.3s;
        }

        .prize-image-display img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }

        .prize-image-display .no-image {
            color: #666;
            font-size: 0.78em;
            text-align: center;
            padding: 10px;
            line-height: 1.6;
        }

        .prize-controls {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .prize-name-input {
            padding: 9px 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.4);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            font-size: 0.9em;
            width: 210px;
        }

        .prize-name-input::placeholder { color: #777; }

        .file-input-label {
            display: inline-block;
            padding: 9px 16px;
            background: linear-gradient(135deg, #3a3a7a, #5a5a9a);
            border: 1px solid rgba(255, 215, 0, 0.35);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.82em;
            transition: all 0.3s;
            text-align: center;
            line-height: 1.4;
        }

        .file-input-label:hover {
            background: linear-gradient(135deg, #5a5a9a, #7a7aba);
            transform: translateY(-1px);
        }

        .file-input-label.green {
            background: linear-gradient(135deg, #1a5a3a, #2a7a5a);
        }

        .file-input-label.green:hover {
            background: linear-gradient(135deg, #2a7a5a, #3a9a7a);
        }

        /* Image Gallery */
        .image-gallery {
            display: none;
            flex-direction: column;
            gap: 6px;
        }

        .image-gallery p {
            color: gold;
            font-size: 0.78em;
        }

        .gallery-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            max-height: 130px;
            overflow-y: auto;
            padding: 4px;
        }

        .gallery-img {
            width: 58px;
            height: 58px;
            object-fit: cover;
            border-radius: 6px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.2s;
        }

        .gallery-img:hover { border-color: rgba(255,215,0,0.6); transform: scale(1.05); }
        .gallery-img.selected { border-color: gold; box-shadow: 0 0 8px rgba(255,215,0,0.6); }

        /* ===== PRIZE REVEAL OVERLAY ===== */
        .prize-reveal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.88);
            z-index: 500;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 25px;
            overflow-y: auto;
            padding: 24px;
        }

        .prize-reveal-overlay.show {
            display: flex;
            animation: overlayFadeIn 0.4s ease;
        }

        @keyframes overlayFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .prize-reveal-content {
            text-align: center;
            animation: prizeRevealPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .reveal-rolling-display {
            display: none;
            width: min(380px, 100%);
            min-height: 84px;
            padding: 16px 12px;
            margin: 12px auto 0;
        }

        .reveal-rolling-display .rolling-name.multi {
            font-size: 1em;
        }

        .prize-result-layout {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
        }

        .prize-result-side {
            width: min(760px, 55vw);
            min-width: 460px;
        }

        @keyframes prizeRevealPop {
            0% { transform: scale(0.3); opacity: 0; }
            70% { transform: scale(1.05); }
            100% { transform: scale(1); opacity: 1; }
        }

        .prize-reveal-label {
            font-size: 1.2em;
            color: #aaa;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .prize-reveal-image {
            width: min(380px, 80vw);
            height: min(380px, 80vw);
            object-fit: cover;
            border-radius: 20px;
            border: 4px solid gold;
            box-shadow: 0 0 60px rgba(255, 215, 0, 0.6), 0 0 120px rgba(255, 215, 0, 0.2);
            animation: prizeGlow 2s infinite alternate;
        }

        @keyframes prizeGlow {
            from { box-shadow: 0 0 40px rgba(255,215,0,0.5), 0 0 80px rgba(255,215,0,0.2); }
            to   { box-shadow: 0 0 80px rgba(255,215,0,0.9), 0 0 160px rgba(255,215,0,0.4); }
        }

        .prize-reveal-no-image {
            width: min(380px, 80vw);
            height: min(380px, 80vw);
            border-radius: 20px;
            border: 4px solid gold;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 6em;
            background: rgba(255,215,0,0.05);
        }

        .prize-reveal-name {
            font-size: 2.2em;
            font-weight: bold;
            color: gold;
            text-shadow: 0 0 30px rgba(255,215,0,0.8);
            margin-top: 20px;
            letter-spacing: 2px;
        }

        .prize-reveal-subtitle {
            font-size: 1em;
            color: #ccc;
            margin-top: 8px;
        }

        .btn-start-draw {
            padding: 16px 50px;
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            border: none;
            border-radius: 30px;
            font-size: 1.2em;
            font-weight: bold;
            color: #1a1a1a;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 2px;
            box-shadow: 0 6px 25px rgba(255,215,0,0.5);
            animation: btnPulse 1.5s infinite alternate;
        }

        @keyframes btnPulse {
            from { box-shadow: 0 6px 25px rgba(255,215,0,0.4); transform: scale(1); }
            to   { box-shadow: 0 8px 40px rgba(255,215,0,0.8); transform: scale(1.03); }
        }

        .btn-start-draw:hover {
            transform: scale(1.08) !important;
        }

        /* Draw Area */
        .draw-area {
            width: 100%;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 25px 4px;
            text-align: center;
        }

        .inline-prize-preview {
            display: none;
            margin-bottom: 18px;
        }

        .inline-prize-details {
            display: grid;
            grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
            align-items: center;
            gap: 28px;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
        }

        #inlineImageWrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 540px;
        }

        .inline-prize-results {
            width: 100%;
            max-width: 660px;
            justify-self: center;
            min-width: 0;
            min-height: 430px;
        }

        .inline-prize-image {
            width: min(500px, 75vw);
            height: min(500px, 75vw);
            border-radius: 12px;
        }

        .prize-placement-label {
            font-size: 1em;
            color: #aaa;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .inline-prize-preview > .prize-reveal-name {
            font-size: 2.2em;
            font-weight: 800;
            color: #ffe45c;
            text-shadow: 0 0 12px rgba(255, 215, 0, 0.8), 0 0 28px rgba(255, 140, 0, 0.45);
            letter-spacing: 1px;
            margin: 0 0 12px;
            animation: prizeTitlePulse 1.8s ease-in-out infinite alternate;
        }

        @keyframes prizeTitlePulse {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        .draw-mode-label {
            color: #aaa;
            font-size: 0.85em;
            margin-bottom: 12px;
        }

        .rolling-display {
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid gold;
            border-radius: 15px;
            padding: 10px 12px;
            min-height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0 14px;
            position: relative;
            overflow: hidden;
        }

        .rolling-display::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,215,0,0.04) 0%, transparent 70%);
            animation: bgPulse 2s infinite;
        }

        @keyframes bgPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.1); opacity: 1; }
        }

        .rolling-name {
            font-size: 2.2em;
            font-weight: bold;
            color: gold;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.8);
            text-align: center;
            z-index: 1;
            word-break: break-word;
            line-height: 1.3;
        }

        .rolling-name.multi {
            font-size: 1.2em;
        }

        /* Winner Announcement */
        .winner-announcement {
            display: none;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            padding: 10px 0;
            min-height: 370px;
        }

        .winner-announcement.show { display: flex; }

        .winner-names-list {
            display: grid;
            grid-template-columns: repeat(2, minmax(200px, 1fr));
            gap: 10px;
            padding: 4px;
            width: 100%;
            min-height: 294px;
            align-content: start;
        }

        .announce-prize-row {
            display: flex;
            align-items: center;
            gap: 15px;
            background: rgba(255,215,0,0.08);
            border: 1px solid rgba(255,215,0,0.3);
            border-radius: 12px;
            padding: 12px 20px;
        }

        .announce-prize-img {
            width: 70px;
            height: 70px;
            object-fit: cover;
            border-radius: 10px;
            border: 2px solid gold;
        }

        .announce-prize-info h3 {
            color: gold;
            font-size: 1em;
        }

        .announce-prize-info p {
            color: #ccc;
            font-size: 0.8em;
            margin-top: 3px;
        }

        .congrats-text {
            font-size: 1.6em;
            font-weight: bold;
            color: gold;
            text-shadow: 0 0 15px rgba(255,215,0,0.6);
            min-height: 37px;
        }

        @keyframes congratsPop {
            0% { transform: scale(0.5); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        .winner-badge {
            background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(255,140,0,0.15));
            border: 2px solid gold;
            border-radius: 25px;
            padding: 10px 16px;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3em;
            font-weight: bold;
            color: white;
            overflow-wrap: anywhere;
            width: 100%;
            animation: badgePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .winner-badge.high-prize-winner {
            grid-column: 1 / -1;
            font-size: 3.2em;
            min-height: 140px;
            border-width: 3px;
            text-align: center;
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.9), 0 0 40px rgba(255, 140, 0, 0.5);
            animation-duration: 0.18s;
        }

        .announcement-actions {
            display: none;
            gap: 14px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .announcement-actions.show { display: flex; }

        .btn-confirm-winner, .btn-redraw-winner {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.5px;
        }

        .btn-confirm-winner {
            background: linear-gradient(135deg, #00c851, #007e33);
            color: white;
            box-shadow: 0 4px 15px rgba(0,200,81,0.4);
        }

        .btn-confirm-winner:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(0,200,81,0.6); }

        .btn-redraw-winner {
            background: linear-gradient(135deg, #ff4d4d, #b30000);
            color: white;
            box-shadow: 0 4px 15px rgba(255,77,77,0.4);
        }

        .btn-redraw-winner:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(255,77,77,0.6); }

        @media (max-width: 700px) {
            .prize-result-layout {
                flex-direction: column;
                gap: 16px;
            }

            .prize-result-side {
                width: min(360px, 85vw);
                min-width: 0;
            }
        }

        @keyframes badgePop {
            0% { transform: scale(0); opacity: 0; }
            70% { transform: scale(1.1); }
            100% { transform: scale(1); opacity: 1; }
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 25px;
            font-size: 0.95em;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 1px;
        }

        .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none !important; }

        .btn-draw1 {
            background: linear-gradient(135deg, #ff6b35, #f7c59f);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(255,107,53,0.4);
        }

        .btn-draw1:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,107,53,0.6);
        }

        .btn-draw10 {
            background: linear-gradient(135deg, #ffd700, #ff8c00);
            color: #1a1a1a;
            box-shadow: 0 4px 15px rgba(255,215,0,0.4);
        }

        .btn-draw10:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(255,215,0,0.6);
        }

        .btn-confirm {
            background: linear-gradient(135deg, #00c851, #007e33);
            color: white;
            box-shadow: 0 4px 15px rgba(0,200,81,0.4);
            display: none;
        }

        .btn-confirm.show { display: inline-block; }
        .btn-confirm:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,200,81,0.6); }

        .btn-reset {
            background: linear-gradient(135deg, #4a4a8a, #6a6aaa);
            color: white;
            box-shadow: 0 4px 15px rgba(74,74,138,0.4);
        }

        .btn-reset:hover:not(:disabled) { transform: translateY(-3px); }

        /* ===== RIGHT PANEL - Participants ===== */
        .participants-panel {
            width: 220px;
            min-width: 220px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 15px;
            padding: 15px;
            max-height: 88vh;
            display: flex;
            flex-direction: column;
        }

        .participants-panel h2 {
            color: gold;
            text-align: center;
            margin-bottom: 15px;
            font-size: 1.1em;
            border-bottom: 1px solid rgba(255, 215, 0, 0.3);
            padding-bottom: 10px;
            flex-shrink: 0;
        }

        .participants-scroll {
            flex: 1;
            overflow-y: auto;
        }

        .participant-item {
            padding: 5px 6px;
            font-size: 0.78em;
            color: #ccc;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            display: flex;
            align-items: center;
            gap: 5px;
            transition: all 0.3s;
        }

        .participant-item .num {
            color: rgba(255,215,0,0.45);
            font-size: 0.72em;
            min-width: 22px;
        }

        .participant-item.removed {
            text-decoration: line-through;
            color: #444;
            opacity: 0.5;
        }

        /* Confetti */
        .confetti-container {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 9999;
        }

        .confetti-piece {
            position: absolute;
            top: -15px;
            animation: confettiFall linear forwards;
        }

        @keyframes confettiFall {
            to { transform: translateY(105vh) rotate(720deg); opacity: 0; }
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: rgba(255,255,255,0.03); }
        ::-webkit-scrollbar-thumb { background: rgba(255,215,0,0.25); border-radius: 4px; }

        /* OneDrive Sync Status */
        .onedrive-status {
            width: 100%;
            text-align: center;
            color: #aaa;
            font-size: 0.78em;
            margin-top: 10px;
        }

        /* Prize Jump (contingency control) */
        .prize-jump-bar {
            width: 100%;
            display: none;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
            color: #aaa;
            font-size: 0.8em;
            flex-wrap: wrap;
        }

        .prize-jump-bar.show { display: flex; }

        .prize-jump-bar select {
            background: rgba(255, 255, 255, 0.08);
            color: white;
            border: 1px solid rgba(255, 215, 0, 0.4);
            border-radius: 8px;
            padding: 4px 8px;
            font-size: 0.95em;
            max-width: 60vw;
        }

        .prize-jump-bar select option {
            background: #1a1a4e;
            color: white;
        }

        .controls-toggle {
            position: fixed;
            bottom: 14px;
            right: 22px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            border: 1px solid rgba(255, 215, 0, 0.3);
            background: rgba(0, 0, 0, 0.35);
            color: rgba(255, 215, 0, 0.5);
            font-size: 1em;
            cursor: pointer;
            z-index: 10;
            transition: all 0.3s;
        }

        .controls-toggle:hover {
            color: gold;
            border-color: gold;
            background: rgba(255, 215, 0, 0.12);
        }

        .controls-toggle:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        /* Responsive */
        @media (max-width: 1100px) {
            .main-container { flex-direction: column; }
            .participants-panel {

        <!-- Draw Area -->

                <div class="inline-prize-details">
                    <div id="inlineImageWrap">
                        <div class="prize-reveal-no-image inline-prize-image" id="inlineNoImage">🎁</div>

                    </div>
                    <div class="inline-prize-results">
                        <div class="rolling-display" id="rollingDisplay">
                            <div class="rolling-name" id="rollingName">Ready to draw!</div>
                        </div>
                        <div class="winner-announcement" id="inlineWinnerAnnouncement">
                            <div class="congrats-text">CONGRATULATIONS!</div>
                            <div class="winner-names-list" id="inlineWinnerNamesList"></div>
                            <div class="announcement-actions" id="announcementActions">
                                <button class="btn-confirm-winner" onclick="confirmWinners()">✅ Confirm Winner</button>

                <label for="prizeJumpSelect">📍 Resume from:</label>
                <select id="prizeJumpSelect" onchange="jumpToPrize(this.value)"></select>
                <button class="panel-btn clear-winners-btn" style="width:auto; margin-top:0;" onclick="resetAll()">⚠️ Reset All</button>
            </div>
        </div>

    </div>

</div>

<!-- Confetti -->
<div class="confetti-container" id="confettiContainer"></div>

<button class="controls-toggle" id="controlsToggle" onclick="toggleControls()" title="Show/hide resume-from list">🎛</button>

<script src="lib/xlsx.full.min.js"></script>
<script>
// =====================================================
//  PREDEFINED PRIZE QUEUE
// =====================================================
const lowPrizeNames = [
    'Nitori Seat Cooling Pad',
    'Selfie Stick Tripod with Bluetooth Control',
    'Baseus Earbuds',
    'Jisulife Handheld Fan',
    'Pineng 20kmAH MAG Safe WirelessCharger (22.5W Fast Charge CCC)'
];

const mediumPrizeNames = [
    'Montigo Midtown Ace Bottle Mega (950ml)',
    'Nexode GAN Robot 65W',
    'Body Shop Gift Set',
    'Hooga Fragrance Gift Set'
];

const voucherPrizeNames = [
    'Voucher for 2-pax Theme Buffet @ RM148nett/pax (Sponsored by Iconic Hotel)',
    'Voucher for Superior Room Night Stay with 2-pax breakfast (Sponsored by Iconic Hotel)'
];

const highPrizeNames = [
    'Ugreen 20kmAH Powerbank Nexode (65W Fast Charge CCC)',
    'Levoit Core 400S Smart Wifi Air',
    'Arzopa Portable Monitor Z3FC 180Hz 16.1',
    'WANBO Cube 2 Pro',
    'Ninja 11-in-1 Smart Multi-Cooker with Smart Lid',
    'Marshall Stanmore III Speaker',
    'Synology DS225+ (Intel Celeron) + 4TB HDD Synology HDD',
    'MSI Claw 8 AI+ 8 inch Gaming Handheld (Core Ultra 7 258V 32GB RAM/1TB SSD)'
];

const prizeImages = {
    'Nitori Seat Cooling Pad': 'images/Nitori Chair Seat U-Cool SP.jpg',
    'Selfie Stick Tripod with Bluetooth Control': 'images/TNW T26 Pro Mini Selfie Stick Tripod with Zoom Bluetooth Control.jpg',
    'Baseus Earbuds': 'images/Earbud Baseus WM01.jpg',
    'Jisulife Handheld Fan': 'images/Jisulife Handheld Fan 5 with Lanyard (4500mAH).jpg',
    'Pineng 20kmAH MAG Safe WirelessCharger (22.5W Fast Charge CCC)': 'images/Pineng PN-702PD 20kmAH Magsafe Wireless Charge.jpeg',
    'Montigo Midtown Ace Bottle Mega (950ml)': 'images/Montigo Midtown Ace Bottle Mega 950ml.jpg',
    'Nexode GAN Robot 65W': 'images/Nexode Gan Robot 65W.jpg',
    'Body Shop Gift Set': 'images/Body Shop Gift Set.jpg',
    'Hooga Fragrance Gift Set': 'images/Hooga Black Series Gift Set.jpg',
    'Voucher for 2-pax Theme Buffet @ RM148nett/pax (Sponsored by Iconic Hotel)': 'images/1x Theme Buffet Dinner for 2 pax.jpg',
    'Voucher for Superior Room Night Stay with 2-pax breakfast (Sponsored by Iconic Hotel)': 'images/1x Superior Room for 2 pax.png',
    'Ugreen 20kmAH Powerbank Nexode (65W Fast Charge CCC)': 'images/Ugreen Powerbank Nexode (20kmAH 65W Fast Charge CCC).jpg',
    'Levoit Core 400S Smart Wifi Air': 'images/Levoit Core 400S Smart Wifi Air.jpg',
    'Arzopa Portable Monitor Z3FC 180Hz 16.1': 'images/Arzopa Portable Monitor Z3FC 180Hz.jpg',
    'WANBO Cube 2 Pro': 'images/Wanbo Cube 2 Pro.png',
    'Ninja 11-in-1 Smart Multi-Cooker with Smart Lid': 'images/Ninja 11-in-1 Smart Multi-Cooker  SmartLID.jpg',
    'Marshall Stanmore III Speaker': 'images/Marshall Stanmore 3.jpg',
    'Synology DS225+ (Intel Celeron) + 4TB HDD Synology HDD': 'images/Synology DS225+ (Intel Celeron) + 4TB HDD Synology HDD.jpg',
    'MSI Claw 8 AI+ 8 inch Gaming Handheld (Core Ultra 7 258V 32GB RAM/1TB SSD)': 'images/MSI Claw 8 AI+ 8 inch Gaming Handheld.jpg'
};

const prizeCatalog = [
    ...lowPrizeNames.map(name => ({ tier: 'Low', name, image: prizeImages[name], emoji: '🎁', units: 10 })),
    ...mediumPrizeNames.map(name => ({ tier: 'Medium', name, image: prizeImages[name], emoji: '🎁', units: 10 })),
    ...voucherPrizeNames.map(name => ({ tier: 'Voucher', name, image: prizeImages[name], emoji: '🎫', units: 1 })),
    ...highPrizeNames.map(name => ({
        tier: 'High',
        name,
        image: prizeImages[name],
        emoji: name.startsWith('Ugreen ') ? '🔋' : '🏆',
        units: name.startsWith('Ugreen ') ? 3 : 1
    }))
];

const prizeQueue = prizeCatalog.flatMap(prize =>
    Array.from({ length: prize.units }, () => ({ ...prize }))
);

// Starting prizeQueue index for each prizeCatalog entry, used by the
// "Resume from" dropdown (a manual contingency control, not a reordering
// tool — the draw order itself is unchanged).
const prizeCatalogOffsets = [];
(() => {
    let offset = 0;
    prizeCatalog.forEach(prize => {
        prizeCatalogOffsets.push(offset);
        offset += prize.units;
    });
})();

// =====================================================
//  STATE
// =====================================================
let originalNames  = [];
let participants   = [];
let winners        = [];
let pendingWinners = [];
let isDrawing      = false;
let roundNumber    = 0;
let prizeIndex     = 0;
let currentDrawCount = 1;
let currentPrizeImage = null;
let currentPrizeName  = '';
let currentPrizeEmoji = '🎁';
let currentPrizeTier = '';
let currentPrizeRank = Infinity; // overall placement (1st, 2nd, 3rd, ...) for non-voucher draws
let rollingInterval = null;
let confirmationTimeout = null;
const smallPrizeRollSound = new Audio('soundeffects/Lucky draw name (for SMALL prize).mp3');
const heartbeatRollSound = new Audio('soundeffects/Lucky draw (heart beat for Top 1, 2, and 3).mp3');
heartbeatRollSound.loop = true;
const topPrizeNameSound = new Audio('soundeffects/Lucky draw name (for Top1 and Top2 prize).mp3');

// =====================================================
//  INIT
// =====================================================
async function init() {
    const startButton = document.getElementById('btnStartDraw');
    startButton.disabled = true;
    startButton.textContent = 'LOADING PARTICIPANTS...';

    try {
        const response = await fetch('participant_names.txt', { cache: 'no-store' });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        originalNames = (await response.text())
            .split(/\r?\n/)
            .map(name => name.trim())
            .filter(Boolean);
        participants = [...originalNames];
    } catch (error) {
        console.error('Unable to load participant_names.txt:', error);
        document.getElementById('drawModeLabel').textContent =
            'Unable to load participant_names.txt. Open this page through a local web server.';
        startButton.textContent = 'PARTICIPANTS UNAVAILABLE';
        return;
    }

    loadDrawState();
    populatePrizeJumpOptions();
    syncPrizeJumpSelect();
    updatePrizeQueueStatus();
    updateStats();
    startButton.disabled = false;
    updateStartButtonLabel();
}

function updateStartButtonLabel() {
    document.getElementById('btnStartDraw').textContent = prizeIndex > 0 && prizeIndex < prizeQueue.length
        ? '🎁 SHOW NEXT PRIZE'
        : '🎁 SHOW PRIZE';
}

// =====================================================
//  PRIZE JUMP (contingency control)
//  Lets the host manually set which prize is up next, in
//  case of an accidental refresh or lost state. The draw
//  order/tiers themselves are never changed by this.
// =====================================================
function populatePrizeJumpOptions() {
    const select = document.getElementById('prizeJumpSelect');
    if (!select) return;
    select.innerHTML = prizeCatalog.map((prize, i) =>
        `<option value="${prizeCatalogOffsets[i]}">${i + 1}. ${prize.emoji} ${prize.name} (${prize.tier})</option>`
    ).join('');
}

function syncPrizeJumpSelect() {
    const select = document.getElementById('prizeJumpSelect');
    if (!select) return;
    let catalogIndex = prizeCatalog.findIndex((prize, i) =>
        prizeIndex >= prizeCatalogOffsets[i] && prizeIndex < prizeCatalogOffsets[i] + prize.units
    );
    if (catalogIndex === -1) catalogIndex = prizeCatalog.length - 1;
    select.value = String(prizeCatalogOffsets[catalogIndex]);
}

function jumpToPrize(value) {
    const target = parseInt(value, 10);

    // Any winners drawn at or after the chosen point are undone: their
    // names go back into the pool and they're removed from the winners
    // list, so storage reflects exactly "up to this point" only.
    const toUndo = winners.filter(w => w.prizeQueuePosition >= target);

    if (toUndo.length) {
        const names = toUndo.map(w => w.name).join(', ');
        if (!confirm(`Resuming from here will undo ${toUndo.length} winner(s) drawn after this point (${names}) and return them to the pool. Continue?`)) {
            syncPrizeJumpSelect();
            return;
        }
    }

    winners = winners.filter(w => w.prizeQueuePosition < target);
    toUndo.forEach(w => {
        if (!participants.includes(w.name)) participants.push(w.name);
    });
    roundNumber = winners.length ? Math.max(...winners.map(w => w.round)) : 0;
    prizeIndex = target;

    updateStats();
    updatePrizeQueueStatus();
    updateStartButtonLabel();
    document.getElementById('btnStartDraw').onclick = initiateDraw;
    syncWinnersToExcel();
    saveDrawState();
}

function toggleControls() {
    document.getElementById('prizeJumpBar').classList.toggle('show');
}

// =====================================================
//  PERSISTENCE
//  Remembers draw progress across page navigations (e.g.
//  toggling to Games.html and back) using localStorage.
// =====================================================
const DRAW_STATE_KEY = 'luckyDrawState';

function saveDrawState() {
    localStorage.setItem(DRAW_STATE_KEY, JSON.stringify({
        originalNamesLength: originalNames.length,
        participants,
        winners,
        roundNumber,
        prizeIndex
    }));
}

function loadDrawState() {
    const raw = localStorage.getItem(DRAW_STATE_KEY);
    if (!raw) return;

    try {
        const saved = JSON.parse(raw);
        if (saved.originalNamesLength !== originalNames.length) return;

        participants = saved.participants;
        winners      = saved.winners;
        roundNumber  = saved.roundNumber;
        prizeIndex   = saved.prizeIndex;
    } catch (error) {
        console.error('Unable to restore saved draw state:', error);
    }
}

function clearDrawState() {
    localStorage.removeItem(DRAW_STATE_KEY);
}

function updateStats() {
    const totalEl     = document.getElementById('totalCount');
    const remainingEl = document.getElementById('remainingCount');
    const drawnEl     = document.getElementById('drawnCount');
    const roundEl     = document.getElementById('roundCount');
    if (totalEl)     totalEl.textContent     = originalNames.length;
    if (remainingEl) remainingEl.textContent = participants.length;
    if (drawnEl)     drawnEl.textContent     = winners.length;
    if (roundEl)     roundEl.textContent     = roundNumber;
}

function updatePrizeQueueStatus() {
    const status = document.getElementById('prizeCatalogStatus');
    if (!status) return;

    if (prizeIndex >= prizeQueue.length) {
        status.innerHTML = '<strong>All prizes have been drawn.</strong>';
        return;
    }

    const prize = prizeQueue[prizeIndex];
    const remaining = prizeQueue
        .slice(prizeIndex)
        .filter(item => item.name === prize.name).length;
    status.innerHTML = `${prize.emoji} ${prize.name} &middot; ${remaining} unit${remaining === 1 ? '' : 's'} remaining`;
}

// =====================================================
//  DRAW FLOW
//  Step 1: initiateDraw  → show prize reveal overlay
//  Step 2: beginActualDraw → start rolling animation
//  Step 3: selectWinners → pick names
//  Step 4: showWinnerAnnouncement → display results
//  Step 5: confirmWinners → finalise & remove from pool
// =====================================================

function ordinal(n) {
    const rem100 = n % 100;
    if (rem100 >= 11 && rem100 <= 13) return `${n}th`;
    switch (n % 10) {
        case 1: return `${n}st`;
        case 2: return `${n}nd`;
        case 3: return `${n}rd`;
        default: return `${n}th`;
    }
}

// Counts down from the last place toward 1st (the grand prize). Voucher
// units don't count toward the ranking at all.
function nonVoucherRank(startIndex) {
    return prizeQueue.slice(startIndex).filter(p => p.tier !== 'Voucher').length;
}

// Shows which overall placement(s) a batch is deciding, e.g. "100th-91st".
// Voucher-tier prizes are excluded from the numbering entirely.
function prizePlacementLabel(startIndex, count, tier) {
    if (tier === 'Voucher') return '🏅 Special Draw';

    const rangeStart = nonVoucherRank(startIndex);
    const rangeEnd = rangeStart - count + 1;
    return count > 1
        ? `🏅 ${ordinal(rangeStart)} - ${ordinal(rangeEnd)} Place`
        : `🏅 ${ordinal(rangeStart)} Place`;
}

function initiateDraw() {
    if (isDrawing) return;
    if (participants.length === 0) { alert('No more participants!'); return; }
    if (prizeIndex >= prizeQueue.length) { alert('All prizes have been drawn!'); return; }

    const prize = prizeQueue[prizeIndex];
    const remainingUnits = prizeQueue
        .slice(prizeIndex)
        .filter(item => item.name === prize.name).length;
    const batchSize = prize.tier === 'Low' || prize.tier === 'Medium' ? 10 : 1;
    currentDrawCount = Math.min(batchSize, remainingUnits, participants.length);
    currentPrizeName = prize.name;
    currentPrizeEmoji = prize.emoji;
    currentPrizeImage = prize.image || null;
    currentPrizeTier = prize.tier;
    currentPrizeRank = prize.tier === 'Voucher' ? Infinity : nonVoucherRank(prizeIndex);

    document.getElementById('prizePlacementLabel').textContent =
        prizePlacementLabel(prizeIndex, currentDrawCount, prize.tier);

    document.getElementById('rollingDisplay').style.display = 'none';
    document.getElementById('inlineWinnerAnnouncement').classList.remove('show');
    document.getElementById('announcementActions').classList.remove('show');
    document.getElementById('btnStartDraw').style.visibility = 'visible';
    document.getElementById('prizeJumpBar').classList.remove('show');
    document.getElementById('controlsToggle').disabled = true;

    // Populate overlay
    const revealImg    = document.getElementById('inlinePrizeImage');
    const revealNoImg  = document.getElementById('inlineNoImage');
    const revealName   = document.getElementById('inlinePrizeName');

    revealName.textContent  = currentDrawCount > 1
        ? `${currentPrizeName} (${currentDrawCount}x)`
        : currentPrizeName;

    if (currentPrizeImage) {
        revealImg.src          = currentPrizeImage;
        revealImg.style.display = 'block';
        revealNoImg.style.display = 'none';
    } else {
        revealImg.style.display   = 'none';
        revealNoImg.style.display = 'flex';
        revealNoImg.textContent = currentPrizeEmoji;
    }

    document.getElementById('inlinePrizePreview').style.display = 'block';
    document.getElementById('drawModeLabel').style.visibility = 'visible';
    const startButton = document.getElementById('btnStartDraw');
    startButton.textContent = '🎰 START DRAW!';
    startButton.onclick = beginActualDraw;

    // Disable draw buttons while overlay is open
}

function beginActualDraw() {
    if (!currentPrizeName) initiateDraw();

    isDrawing = true;
    pendingWinners = [];

    document.getElementById('btnStartDraw').style.visibility = 'hidden';
    document.getElementById('rollingDisplay').style.display = 'flex';

    document.getElementById('inlineWinnerAnnouncement').classList.remove('show');
    document.getElementById('drawModeLabel').style.visibility = 'visible';
    document.getElementById('drawModeLabel').textContent =
        `🎲 Drawing ${currentDrawCount} winner${currentDrawCount > 1 ? 's' : ''}...`;

    const rollingName = document.getElementById('rollingName');
    rollingName.className = 'rolling-name' + (currentDrawCount > 1 ? ' multi' : '');

    if (currentPrizeRank <= 3) {
        heartbeatRollSound.currentTime = 0;
        heartbeatRollSound.play().catch(() => {});
    }

    let rollCount = 0;
    const maxRolls = currentPrizeRank <= 3 ? 133 : 35; // ~10s for top 3 (heartbeat), ~2.6s otherwise

    rollingInterval = setInterval(() => {
        const idx = Math.floor(Math.random() * participants.length);
        rollingName.textContent = participants[idx];
        rollCount++;
        if (rollCount >= maxRolls) {
            clearInterval(rollingInterval);
            heartbeatRollSound.pause();
            heartbeatRollSound.currentTime = 0;
            selectWinners(currentDrawCount);
        }
    }, 75);
}

function selectWinners(count) {
    pendingWinners = [];
    const pool = [...participants];
    for (let i = 0; i < count; i++) {
        if (!pool.length) break;
        const idx = Math.floor(Math.random() * pool.length);
        pendingWinners.push(pool.splice(idx, 1)[0]);
    }
    showWinnerAnnouncement();
}

function showWinnerAnnouncement() {
    const announcement  = document.getElementById('inlineWinnerAnnouncement');
    const namesList     = document.getElementById('inlineWinnerNamesList');
    const rollingName   = document.getElementById('rollingName');

    // Winner badges
    namesList.innerHTML = '';
    const isBigReveal = currentPrizeTier === 'High' || currentPrizeTier === 'Voucher';
    const badgeStagger = isBigReveal ? 2000 : 2500;
    pendingWinners.forEach((name, i) => {
        setTimeout(() => {
            const badge = document.createElement('div');
            badge.className   = 'winner-badge' + (isBigReveal ? ' high-prize-winner' : '');
            badge.textContent = name;
            namesList.appendChild(badge);

            if (!isBigReveal) {
                smallPrizeRollSound.currentTime = 0;
                smallPrizeRollSound.play().catch(() => {});
            } else if (currentPrizeRank <= 2) {
                topPrizeNameSound.currentTime = 0;
                topPrizeNameSound.play().catch(() => {});
            }
        }, i * badgeStagger);
    });

    // Update rolling display text
    rollingName.textContent = pendingWinners.length === 1
        ? `🏆 ${pendingWinners[0]}`
        : '';
    document.getElementById('rollingDisplay').style.display = pendingWinners.length === 1 ? 'flex' : 'none';

    announcement.classList.add('show');
    document.getElementById('drawModeLabel').textContent = '';
    document.getElementById('drawModeLabel').style.visibility = 'hidden';

    launchConfetti(isBigReveal);

    const actions = document.getElementById('announcementActions');
    if (isBigReveal) {
        // High-tier/voucher prizes wait for the host to confirm the winner is
        // present, or redraw someone else, instead of auto-confirming.
        actions.classList.add('show');
    } else {
        actions.classList.remove('show');
        confirmationTimeout = setTimeout(confirmWinners, Math.max(2400, pendingWinners.length * badgeStagger + 1200));
    }
}

// Re-picks a new winner for the same prize (used when the drawn person
// isn't present). The absent name is permanently removed from the pool
// (they're confirmed not present, so they shouldn't be drawn again),
// but no prize unit is consumed — only the person who confirms present
// and is actually awarded the prize counts toward it.
function redrawWinner() {
    clearTimeout(confirmationTimeout);
    confirmationTimeout = null;
    document.getElementById('announcementActions').classList.remove('show');
    document.getElementById('inlineWinnerAnnouncement').classList.remove('show');

    pendingWinners.forEach(name => {
        const idx = participants.indexOf(name);
        if (idx > -1) participants.splice(idx, 1);
    });
    saveDrawState();

    const rollingName = document.getElementById('rollingName');
    document.getElementById('rollingDisplay').style.display = 'flex';
    rollingName.className = 'rolling-name';

    let rollCount = 0;
    const maxRolls = 15;
    rollingInterval = setInterval(() => {
        const idx = Math.floor(Math.random() * participants.length);
        rollingName.textContent = participants[idx];
        rollCount++;
        if (rollCount >= maxRolls) {
            clearInterval(rollingInterval);
            selectWinners(currentDrawCount);
        }
    }, 75);
}

function confirmWinners() {
    clearTimeout(confirmationTimeout);
    confirmationTimeout = null;
    document.getElementById('announcementActions').classList.remove('show');
    roundNumber++;
    const confirmedWinnerCount = pendingWinners.length;

    pendingWinners.forEach(name => {
        const idx = participants.indexOf(name);
        if (idx > -1) participants.splice(idx, 1);

        winners.push({
            name:     name,
            prize:    currentPrizeName,
            prizeImg: currentPrizeImage,
            prizeEmoji: currentPrizeEmoji,
            round:    roundNumber,
            prizeQueuePosition: prizeIndex
        });

    });

    updateStats();

    // Reset state
    isDrawing      = false;
    pendingWinners = [];
    currentPrizeName = '';
    currentPrizeImage = null;
    currentPrizeTier = '';

    prizeIndex += confirmedWinnerCount;
    updatePrizeQueueStatus();
    syncWinnersToExcel();
    saveDrawState();
    syncPrizeJumpSelect();
    document.getElementById('controlsToggle').disabled = false;
    document.getElementById('btnStartDraw').style.visibility = 'visible';
    document.getElementById('btnStartDraw').textContent = prizeIndex >= prizeQueue.length
        ? '🎁 SHOW PRIZE'
        : '🎁 SHOW NEXT PRIZE';
    document.getElementById('btnStartDraw').onclick = initiateDraw;
    document.getElementById('rollingDisplay').style.display = 'none';
    document.getElementById('rollingName').textContent = 'Press Draw to Start!';
    document.getElementById('rollingName').className   = 'rolling-name';
    document.getElementById('drawModeLabel').textContent = '';
    document.getElementById('drawModeLabel').style.visibility = 'hidden';
}

// =====================================================
//  CONFETTI
// =====================================================
function launchConfetti(isHighPrize = false) {
    const container = document.getElementById('confettiContainer');
    container.innerHTML = '';
    const colors = ['#ffd700','#ff6b35','#ff1493','#00ff88','#00bfff','#ff69b4','#adff2f','#ff4500'];
    const shapes = ['50%', '0%', '0%'];

    const pieceCount = isHighPrize ? 180 : 100;
    for (let i = 0; i < pieceCount; i++) {
        setTimeout(() => {
            const p = document.createElement('div');
            p.className = 'confetti-piece';
            const size = Math.random() * 10 + 6;
            p.style.cssText = `
                left: ${Math.random() * 100}vw;
                width: ${size}px;
                height: ${size}px;
                background: ${colors[Math.floor(Math.random() * colors.length)]};
                border-radius: ${shapes[Math.floor(Math.random() * shapes.length)]};
                animation-duration: ${Math.random() * 2.5 + 2}s;
                animation-delay: ${Math.random() * 0.8}s;
                opacity: 1;
            `;
            container.appendChild(p);
            setTimeout(() => p.remove(), 4500);
        }, i * 25);
    }
}

// =====================================================
//  UTILITIES
// =====================================================
function resetAll() {
    if (!confirm('⚠️ Reset ALL participants and winners? This cannot be undone.')) return;
    participants   = [...originalNames];
    winners        = [];
    pendingWinners = [];
    roundNumber    = 0;
    prizeIndex     = 0;
    isDrawing      = false;
    currentPrizeName = '';
    currentPrizeImage = null;
    currentPrizeTier = '';
    currentPrizeRank = Infinity;
    clearTimeout(confirmationTimeout);
    confirmationTimeout = null;
    clearInterval(rollingInterval);
    heartbeatRollSound.pause();
    heartbeatRollSound.currentTime = 0;
    smallPrizeRollSound.pause();
    smallPrizeRollSound.currentTime = 0;

    document.getElementById('inlineWinnerAnnouncement').classList.remove('show');
    document.getElementById('announcementActions').classList.remove('show');
    document.getElementById('drawModeLabel').style.visibility = 'hidden';
    document.getElementById('inlinePrizePreview').style.display = 'none';
    document.getElementById('controlsToggle').disabled = false;
    document.getElementById('btnStartDraw').style.visibility = 'visible';
    document.getElementById('btnStartDraw').textContent = '🎁 SHOW PRIZE';
    document.getElementById('btnStartDraw').onclick = initiateDraw;
    document.getElementById('rollingDisplay').style.display = 'none';
    document.getElementById('rollingName').textContent = 'Press Draw to Start!';
    document.getElementById('rollingName').className   = 'rolling-name';
    document.getElementById('drawModeLabel').textContent = '';

    syncPrizeJumpSelect();
    updatePrizeQueueStatus();
    updateStats();
    syncWinnersToExcel();
    clearDrawState();
}

function clearWinners() {
    if (!confirm('Clear the winners display list? (Removed participants stay removed)')) return;
    winners = [];
    updateStats();
    syncWinnersToExcel();
    saveDrawState();
}

function exportWinners() {
    if (!winners.length) { alert('No winners to export!'); return; }

    let txt = '╔══════════════════════════════╗\n';
    txt    += '║      LUCKY DRAW WINNERS       ║\n';
    txt    += '╚══════════════════════════════╝\n\n';

    const rounds = {};
    winners.forEach(w => {
        if (!rounds[w.round]) rounds[w.round] = [];
        rounds[w.round].push(w);
    });

    Object.keys(rounds).forEach(r => {
        txt += `── Round ${r} ──────────────────────\n`;
        rounds[r].forEach(w => {
            txt += `  🏆 ${w.name}  |  Prize: ${w.prize}\n`;
        });
        txt += '\n';
    });

    txt += `────────────────────────────────\n`;
    txt += `Total Winners    : ${winners.length}\n`;
    txt += `Remaining        : ${participants.length}\n`;
    txt += `Total Rounds     : ${roundNumber}\n`;
    txt += `Generated        : ${new Date().toLocaleString()}\n`;

    const blob = new Blob([txt], { type: 'text/plain' });
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href     = url;
    a.download = 'lucky_draw_winners.txt';
    a.click();
    URL.revokeObjectURL(url);
}

// =====================================================
//  EXCEL SYNC
//  Writes the winners workbook via the local server, which
//  saves it to a fixed path (e.g. a OneDrive-synced folder)
//  with no file picker or user interaction required.
// =====================================================
function updateOneDriveSyncStatus(text) {
    const el = document.getElementById('onedriveStatus');
    if (el) el.textContent = text;
}

async function syncWinnersToExcel() {
    if (typeof XLSX === 'undefined') {
        updateOneDriveSyncStatus('⚠️ Excel library failed to load');
        return;
    }
    try {
        const rows = [['Round', 'Winner Name', 'Prize']];
        winners.forEach(w => rows.push([w.round, w.name, w.prize]));
        const sheet = XLSX.utils.aoa_to_sheet(rows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, sheet, 'Winners');
        const data = XLSX.write(workbook, { type: 'array', bookType: 'xlsx' });

        const response = await fetch('/save-winners', { method: 'POST', body: data });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        updateOneDriveSyncStatus(`✅ Synced ${winners.length} winner(s) at ${new Date().toLocaleTimeString()}`);
    } catch (err) {
        console.error('Failed to sync winners to Excel file:', err);
        updateOneDriveSyncStatus('⚠️ Sync failed: ' + err.message + ' (is server.py running?)');
    }
}

// =====================================================
//  START
// =====================================================
init();
